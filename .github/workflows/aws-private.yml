name: Verify private AWS deployment
on:
  pull_request:
    paths: ["deploy/aws/**", "scripts/*aws-private.ps1", "scripts/verify-aws-private.mjs", "e2e/aws-private/**", "compose.*demo*.yml", "compose.aws-private.yml", ".github/workflows/aws-private.yml", "backend/Dockerfile", "frontend/Dockerfile"]
  push:
    branches: [main, "codex/**"]
    paths: ["deploy/aws/**", "scripts/*aws-private.ps1", "scripts/verify-aws-private.mjs", "e2e/aws-private/**", "compose.*demo*.yml", "compose.aws-private.yml", ".github/workflows/aws-private.yml", "backend/Dockerfile", "frontend/Dockerfile"]
permissions:
  contents: read
jobs:
  deployment-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n deploy/aws/bootstrap-host.sh deploy/aws/init-private.sh deploy/aws/start-private.sh deploy/aws/start-university-demo.sh deploy/aws/stop-university-demo.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('scripts/prepare-aws-private.ps1','scripts/connect-aws-private.ps1','scripts/open-aws-private.ps1','scripts/close-aws-private.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$null, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Check private network boundaries and key lifecycle
        run: python3 -m unittest discover -s deploy/aws/tests -v
      - name: Check AWS CLI object and single-item array serialization
        shell: pwsh
        run: ./deploy/aws/tests/check-json-arguments.ps1
      - name: Check private tunnel reconnection without AWS credentials
        shell: pwsh
        run: ./deploy/aws/tests/check-connection-recovery.ps1
      - name: Check acceptance script syntax (live run is manual and private)
        run: node --check scripts/verify-aws-private.mjs
