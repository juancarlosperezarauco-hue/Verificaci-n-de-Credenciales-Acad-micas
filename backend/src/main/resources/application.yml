spring:
  application:
    name: credential-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credentials}
    username: ${DB_USERNAME:credentials}
    password: ${DB_PASSWORD:credentials}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:4200}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:credentials}

