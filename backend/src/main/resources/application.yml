spring:
  application:
    name: credential-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credentials}
    username: ${DB_USERNAME:credentials}
    password: ${DB_PASSWORD:credentials}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  ai:
    enabled: ${AI_ANALYSIS_ENABLED:false}
    url: ${AI_SERVICE_URL:http://ai-service:8000}
    token: ${AI_SERVICE_TOKEN:}
  evidence:
    encryption-key: ${EVIDENCE_ENCRYPTION_KEY:}
    key-id: ${EVIDENCE_KEY_ID:legacy}
    previous-keys: ${EVIDENCE_PREVIOUS_KEYS:}
    retention-days: ${EVIDENCE_RETENTION_DAYS:90}
    cleanup-enabled: ${EVIDENCE_CLEANUP_ENABLED:false}
  signing:
    encryption-key: ${SIGNING_ENCRYPTION_KEY:}
    allow-demo: ${SIGNING_ALLOW_DEMO:false}
  mail-outbox:
    encryption-key: ${MAIL_ENCRYPTION_KEY}
    key-id: ${MAIL_KEY_ID:legacy}
    previous-keys: ${MAIL_PREVIOUS_KEYS:}
    worker-enabled: ${MAIL_WORKER_ENABLED:true}
    max-attempts: 5
    retry-seconds: 30
    lease-seconds: 120
    poll-ms: 1000
  frontend-url: ${APP_FRONTEND_URL:${ALLOWED_ORIGIN:http://localhost:4200}}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-key-id: ${JWT_KEY_ID:legacy}
    jwt-previous-keys: ${JWT_PREVIOUS_KEYS:}
    mfa-key-id: ${MFA_KEY_ID:legacy}
    mfa-previous-keys: ${MFA_PREVIOUS_KEYS:}
    retention-days: ${SECURITY_RETENTION_DAYS:30}
    maintenance-enabled: ${SECURITY_MAINTENANCE_ENABLED:true}
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY}
    rate-limit-enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:4200}
  storage:
    health-enabled: ${STORAGE_HEALTH_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:credentials}
