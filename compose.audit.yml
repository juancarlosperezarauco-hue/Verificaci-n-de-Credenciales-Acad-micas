# Entorno descartable y separado. No usa volúmenes ni nombres del proyecto principal.
# Usa las variables del .env local; no contiene secretos y no se despliega en producción.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credentials_audit
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configura MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configura MINIO_ROOT_PASSWORD en .env}
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/credentials_audit
      DB_USERNAME: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Configura MFA_ENCRYPTION_KEY en el entorno de prueba}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?Configura MAIL_ENCRYPTION_KEY en el entorno de prueba}
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:-}
      EVIDENCE_KEY_ID: ${EVIDENCE_KEY_ID:-legacy}
      EVIDENCE_PREVIOUS_KEYS: ${EVIDENCE_PREVIOUS_KEYS:-}
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-90}
      EVIDENCE_CLEANUP_ENABLED: ${EVIDENCE_CLEANUP_ENABLED:-false}
      SIGNING_ENCRYPTION_KEY: ${SIGNING_ENCRYPTION_KEY:-}
      SIGNING_ALLOW_DEMO: ${SIGNING_ALLOW_DEMO:-false}
      JWT_KEY_ID: ${JWT_KEY_ID:-legacy}
      JWT_PREVIOUS_KEYS: ${JWT_PREVIOUS_KEYS:-}
      MFA_KEY_ID: ${MFA_KEY_ID:-legacy}
      MFA_PREVIOUS_KEYS: ${MFA_PREVIOUS_KEYS:-}
      MAIL_KEY_ID: ${MAIL_KEY_ID:-legacy}
      MAIL_PREVIOUS_KEYS: ${MAIL_PREVIOUS_KEYS:-}
      SECURITY_RETENTION_DAYS: ${SECURITY_RETENTION_DAYS:-30}
      SECURITY_MAINTENANCE_ENABLED: ${SECURITY_MAINTENANCE_ENABLED:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Configura MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Configura MINIO_ROOT_PASSWORD en .env}
      MINIO_BUCKET: audit-credentials
      APP_FRONTEND_URL: http://localhost:${AUDIT_FRONTEND_PORT:-4301}
      ALLOWED_ORIGIN: http://localhost:${AUDIT_FRONTEND_PORT:-4301}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${AUDIT_API_PORT:-18081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${AUDIT_MAIL_PORT:-18125}:8025"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.runtime
    ports:
      - "127.0.0.1:${AUDIT_FRONTEND_PORT:-4301}:80"
    depends_on:
      - backend
