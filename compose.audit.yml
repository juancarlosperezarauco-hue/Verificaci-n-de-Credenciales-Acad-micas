# Entorno descartable y separado. No usa volúmenes ni nombres del proyecto principal.
# Usa las variables del .env local; no contiene secretos y no se despliega en producción.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credentials_audit
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configura MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configura MINIO_ROOT_PASSWORD en .env}
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/credentials_audit
      DB_USERNAME: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Configura MINIO_ROOT_USER en .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Configura MINIO_ROOT_PASSWORD en .env}
      MINIO_BUCKET: audit-credentials
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${AUDIT_API_PORT:-18081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
