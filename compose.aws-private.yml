# Private evaluation only: access through an authenticated SSM tunnel.
# Keep this standalone; never combine it with the public production compose.
name: credenciales-aws-private
x-logging: &logging
  driver: local
  options: {max-size: 10m, max-file: "3"}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      POSTGRES_DB: credentials
      POSTGRES_USER: credentials
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U credentials -d credentials"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      GOMEMLIMIT: 256MiB
    volumes: [minio_data:/data]
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    mem_limit: 96m
    logging: *logging
    ports: ["127.0.0.1:8126:8025"]
  backend:
    build:
      context: ./backend
      args: {MAVEN_OPTS: -Xmx512m}
    restart: unless-stopped
    mem_limit: 768m
    read_only: true
    tmpfs: ["/tmp:size=96m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: private-evaluation
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
      DB_URL: jdbc:postgresql://postgres:5432/credentials
      DB_USERNAME: credentials
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
      JWT_SECRET: ${JWT_SECRET:?}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?}
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:?}
      SIGNING_ENCRYPTION_KEY: ${SIGNING_ENCRYPTION_KEY:?}
      SIGNING_ALLOW_DEMO: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET: credentials
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      APP_FRONTEND_URL: http://localhost:4302
      ALLOWED_ORIGIN: http://localhost:4302
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?}
      AI_ANALYSIS_ENABLED: "true"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
      ai-service: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/actuator/health/readiness]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
  ai-service:
    build: ./ai-service
    restart: unless-stopped
    mem_limit: 384m
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    logging: *logging
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?}
      OMP_THREAD_LIMIT: "1"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args: {NODE_OPTIONS: --max-old-space-size=1536}
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
    ports: ["127.0.0.1:4302:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  minio_data:
