# Isolated rehearsal only. No published ports, production volumes or application workers.
services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credentials_audit}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [restore_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    mem_limit: 256m
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      GOMEMLIMIT: 192MiB
    volumes: [restore_minio:/data]
volumes:
  restore_postgres:
  restore_minio:
