services:
  postgres:
    image: postgres:16-alpine
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credentials}
      POSTGRES_USER: ${POSTGRES_USER:-credentials}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credentials_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    mem_limit: ${MINIO_MEMORY_LIMIT:-256m}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      GOMEMLIMIT: 192MiB
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    mem_limit: 96m
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    build: ./backend
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx384m}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-false}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-credentials}
      DB_USERNAME: ${POSTGRES_USER:-credentials}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-credentials_local}
      JWT_SECRET: ${JWT_SECRET:?Configura una clave JWT_SECRET privada en .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Configura MFA_ENCRYPTION_KEY independiente en .env}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?Configura MAIL_ENCRYPTION_KEY independiente en .env}
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:-}
      EVIDENCE_KEY_ID: ${EVIDENCE_KEY_ID:-legacy}
      EVIDENCE_PREVIOUS_KEYS: ${EVIDENCE_PREVIOUS_KEYS:-}
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-90}
      EVIDENCE_CLEANUP_ENABLED: ${EVIDENCE_CLEANUP_ENABLED:-false}
      SIGNING_ENCRYPTION_KEY: ${SIGNING_ENCRYPTION_KEY:-}
      SIGNING_ALLOW_DEMO: ${SIGNING_ALLOW_DEMO:-false}
      JWT_KEY_ID: ${JWT_KEY_ID:-legacy}
      JWT_PREVIOUS_KEYS: ${JWT_PREVIOUS_KEYS:-}
      MFA_KEY_ID: ${MFA_KEY_ID:-legacy}
      MFA_PREVIOUS_KEYS: ${MFA_PREVIOUS_KEYS:-}
      MAIL_KEY_ID: ${MAIL_KEY_ID:-legacy}
      MAIL_PREVIOUS_KEYS: ${MAIL_PREVIOUS_KEYS:-}
      SECURITY_RETENTION_DAYS: ${SECURITY_RETENTION_DAYS:-30}
      SECURITY_MAINTENANCE_ENABLED: ${SECURITY_MAINTENANCE_ENABLED:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-credentials}
      ALLOWED_ORIGIN: http://localhost:${FRONTEND_PORT:-4200}
      APP_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-4200}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  ai-service:
    build: ./ai-service
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OMP_THREAD_LIMIT: 1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    mem_limit: 96m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 3
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
