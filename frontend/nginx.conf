server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/credential-security-headers.conf;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # Confirmation/reset URLs carry single-use secrets. Never include them in access logs.
    location ~ ^/student/(recover|confirm-email)/?$ {
        access_log off;
        include /etc/nginx/credential-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /api/me/identity-verifications {
        client_max_body_size 16m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
