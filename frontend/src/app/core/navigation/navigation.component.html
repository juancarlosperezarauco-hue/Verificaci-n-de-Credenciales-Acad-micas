<button
  type="button"
  class="menu-toggle"
  [attr.aria-expanded]="opened()"
  aria-haspopup="dialog"
  aria-label="Abrir menú lateral"
  (click)="open()"
>
  <svg
    aria-hidden="true"
    width="21"
    height="21"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
  >
    <path d="M4 6h16M4 12h16M4 18h16" /></svg
  ><span>Menú</span>
</button>
